name: Release

on:
  push:
    tags: ['v*']
  # GitHub doesn't start workflows on this fork when a tag is pushed, so a release can also be
  # started by hand from main for a tag already pushed: gh workflow run release.yml -f tag=vX.Y.Z
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release, such as v1.2.3, which must hold the same code as main
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test "${TAG#v}" = "$version" || {
            echo "::error::Tag $TAG does not match version $version in Cargo.toml"
            exit 1
          }
      - name: Check the code being built is the tag's
        # Started by hand, the release builds main, so main must differ from the tag only in its workflows.
        run: |
          git diff --quiet "refs/tags/$TAG" HEAD -- . ':(exclude).github' || {
            echo "::error::main holds different code from $TAG"
            exit 1
          }

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      version: ${{ inputs.tag || github.ref_name }}

  smoke:
    needs: build
    uses: ./.github/workflows/smoke.yml
    permissions:
      contents: read

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: romp-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          make release-notes VERSION="${TAG#v}" > notes.md
          gh release create "$TAG" dist/* --verify-tag --title "ROM Play ${TAG#v}" --notes-file notes.md
