<!-- ROM Play's icon artwork, full bleed. render.sh turns it into every icon the app ships. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A0E7A"/>
      <stop offset="0.55" stop-color="#7209B7"/>
      <stop offset="1" stop-color="#F72585"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4DEFA"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4CC9F0"/>
      <stop offset="0.6" stop-color="#4361EE"/>
      <stop offset="1" stop-color="#3A0CA3"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Pixel sparkles -->
  <g fill="#FFFFFF">
    <rect x="808" y="168" width="28" height="28" opacity="0.9"/>
    <rect x="780" y="168" width="28" height="28" opacity="0.35"/>
    <rect x="836" y="168" width="28" height="28" opacity="0.35"/>
    <rect x="808" y="140" width="28" height="28" opacity="0.35"/>
    <rect x="808" y="196" width="28" height="28" opacity="0.35"/>
    <rect x="168" y="800" width="22" height="22" opacity="0.7"/>
    <rect x="132" y="764" width="16" height="16" opacity="0.45"/>
    <rect x="856" y="760" width="18" height="18" opacity="0.5"/>
  </g>

  <!-- Shadow -->
  <ellipse cx="512" cy="852" rx="250" ry="28" fill="#1A0040" opacity="0.35"/>

  <!-- Cartridge -->
  <path fill="url(#shell)" d="M308 196 H688 L772 280 V800 Q772 830 742 830 H282 Q252 830 252 800 V252 Q252 196 308 196 Z"/>
  <!-- Side grips -->
  <g fill="#D3CBF4">
    <rect x="252" y="330" width="14" height="22" rx="4"/>
    <rect x="252" y="370" width="14" height="22" rx="4"/>
    <rect x="252" y="410" width="14" height="22" rx="4"/>
    <rect x="758" y="330" width="14" height="22" rx="4"/>
    <rect x="758" y="370" width="14" height="22" rx="4"/>
    <rect x="758" y="410" width="14" height="22" rx="4"/>
  </g>
  <!-- Grip ridges along the top -->
  <g fill="#D3CBF4">
    <rect x="330" y="222" width="250" height="12" rx="6"/>
    <rect x="330" y="246" width="250" height="12" rx="6"/>
  </g>
  <!-- Label with a play button -->
  <rect x="300" y="290" width="424" height="366" rx="40" fill="url(#label)"/>
  <rect x="300" y="290" width="424" height="183" rx="40" fill="#FFFFFF" opacity="0.10"/>
  <path d="M466 386 L466 554 L600 470 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="34" stroke-linejoin="round"/>
  <!-- Connector edge -->
  <path fill="#CFC6F2" d="M252 726 H772 V800 Q772 830 742 830 H282 Q252 830 252 800 Z"/>
  <g fill="#A99CE0">
    <rect x="316" y="752" width="28" height="56" rx="6"/>
    <rect x="364" y="752" width="28" height="56" rx="6"/>
    <rect x="412" y="752" width="28" height="56" rx="6"/>
    <rect x="460" y="752" width="28" height="56" rx="6"/>
    <rect x="536" y="752" width="28" height="56" rx="6"/>
    <rect x="584" y="752" width="28" height="56" rx="6"/>
    <rect x="632" y="752" width="28" height="56" rx="6"/>
    <rect x="680" y="752" width="28" height="56" rx="6"/>
  </g>
</svg>
