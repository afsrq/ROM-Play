<!-- The README banner. render.sh draws it to docs/banner.png. -->
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="800" viewBox="0 0 2400 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B0A4F"/>
      <stop offset="0.6" stop-color="#4A0C8F"/>
      <stop offset="1" stop-color="#B0157A"/>
    </linearGradient>
  </defs>
  <rect width="2400" height="800" fill="url(#bg)"/>
  <g fill="#FFFFFF" opacity="0.18">
    <rect x="2140" y="120" width="40" height="40"/>
    <rect x="2240" y="620" width="28" height="28"/>
    <rect x="1980" y="660" width="20" height="20"/>
    <rect x="160" y="640" width="24" height="24"/>
  </g>
  <text x="1010" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="190" font-weight="800" fill="#FFFFFF">ROM Play</text>
  <text x="1016" y="510" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="58" fill="#E6DBFF">Your RomM library, ready to play on your Mac.</text>
</svg>
